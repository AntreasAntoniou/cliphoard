# DISABLED TEMPLATE. No route, namespace, account or secret is configured.
name = "cliphoard-stripe-fulfilment"
main = "src/stripe-worker.mjs"
compatibility_date = "2026-07-01"
workers_dev = false
preview_urls = false

[observability]
enabled = false
[observability.logs]
enabled = false
invocation_logs = false

[vars]
STRIPE_MODE = "test"
STRIPE_ACCOUNT_ID = "REPLACE"
STRIPE_PRODUCT_ID = "REPLACE"
STRIPE_PRICE_ID = "REPLACE"
STRIPE_CURRENCY = "usd"
STRIPE_UNIT_AMOUNT = "1000"
PUBLIC_ORIGIN = "https://REPLACE.invalid"
CANCEL_URL = "https://REPLACE.invalid/?cancelled=1"
DOWNLOAD_URL = "https://github.com/AntreasAntoniou/cliphoard/releases/latest"
CHECKOUT_ENABLED = "false"
ISSUANCE_ENABLED = "false"
DELIVERY_ENABLED = "false"
EMAIL_DELIVERY_ENABLED = "false"
EMAIL_FROM = "REPLACE@REPLACE.invalid"
CLAIM_KEY_ID = "claim-v1"
EXPECTED_PUBLIC_KEY_HEX = "REPLACE_WITH_SYNTHETIC_TEST_KEY"

