# Proves the auto-download-and-convert path end to end, WITHOUT needing the
# Apple signing cert. Run it from the Actions tab (Run workflow) any time, and
# it runs automatically when the conversion tooling changes. This is the
# cert-free guarantee that a release build will get working on-device models
# rather than silently falling back to the weak hashing embedder.
name: Models (restore + convert)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/models.yml'

jobs:
  restore-convert:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache on-device models
        uses: actions/cache@v4
        with:
          path: tools/models
          key: models-v2-${{ hashFiles('tools/restore-models.sh', 'tools/pack-openvision.sh', 'tools/convert_openvision.py', 'tools/convert_ogma_libre.py', 'tools/convert_minilm.py', 'tools/_dl.py', 'tools/_compat.py', 'tools/requirements.txt') }}
          restore-keys: |
            models-v2-

      - name: Install conversion deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements.txt

      - name: Restore + convert on-device models (ogma + MiniLM from HuggingFace; OpenVision from the pinned zip)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: bash tools/restore-models.sh

      - name: Verify artifacts + tokenizers
        run: |
          fail=0
          for n in open-ogma-micro open-ogma-small all-MiniLM-L6-v2 openvision-tiny-p8-text; do
            [ -d "tools/models/$n.mlpackage" ] || { echo "::error::missing tools/models/$n.mlpackage after restore"; fail=1; }
            [ -f "tools/models/$n/tokenizer.json" ] || { echo "::error::missing tools/models/$n/tokenizer.json (build-app.sh needs it)"; fail=1; }
          done
          [ -d tools/models/openvision-tiny-p8-image.mlpackage ] || { echo "::error::missing openvision image tower"; fail=1; }
          [ -f tools/models/openvision-tiny-p8-text/config.json ] || { echo "::error::missing openvision tokenizer config.json"; fail=1; }
          [ "$fail" -eq 0 ] && echo "✓ ogma, MiniLM and OpenVision restored"
          exit $fail
