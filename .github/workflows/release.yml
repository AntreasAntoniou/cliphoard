name: Release

# Tag a version (e.g. `git tag v1.0.0 && git push --tags`) to build, sign,
# notarize and package a candidate DMG. Download the workflow artifact for the
# clean-machine install/Free/Pro acceptance gate, then promote those exact bytes.
# No tag or workflow dispatch automatically publishes or pushes the cask.
#
# Run it by hand (Actions → Release → Run workflow, or `gh workflow run Release --ref main`)
# for an UNSIGNED DRY RUN: no secrets needed, signing/notarization/publishing are skipped,
# the cask is untouched. It proves the CI compile + model-free verify-bundle path.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12        base64 of your "Developer ID Application" .p12 (base64 -i cert.p12 | tr -d '\n')
#   MACOS_CERT_PASSWORD   password for that .p12
#   KEYCHAIN_PASSWORD     any throwaway password for the temp CI keychain
#   MACOS_DEVID           e.g. "Developer ID Application: Your Name (TEAMID)"
#   MACOS_PROVISION_PROFILE_BASE64  base64 of the matching Developer ID profile
#   APPLE_ID              your Apple ID email (for notarytool)
#   APPLE_TEAM_ID         your 10-char Team ID
#   APPLE_APP_PASSWORD    an app-specific password from account.apple.com
# The first step fails by NAME on any that is missing or malformed (Scripts/ci-preflight-secrets.sh).
#
# Model weights are optional Hugging Face downloads. CI never restores them into an app.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # macos-14 is deprecated on actions/runner-images; macos-26's default Xcode (26.x) is the
    # toolchain generation this code is developed on.
    runs-on: macos-26
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight release secrets
        if: env.DRY_RUN != 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_DEVID: ${{ secrets.MACOS_DEVID }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash Scripts/ci-preflight-secrets.sh

      - name: Set up Python (for bundle validation)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select the verified Python runtime
        env:
          SELECTED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$SELECTED_PYTHON" -c 'import sys; assert sys.version_info >= (3, 13)'
          echo "CLIPHOARD_PYTHON=$SELECTED_PYTHON" >> "$GITHUB_ENV"

      # Model weights are downloaded by the app from Hugging Face, never packaged.

      - name: Run regression tests before signing
        run: |
          "$CLIPHOARD_PYTHON" -m unittest discover -s Tests/release -v
          env -u CLIPHOARD_LIVE_COPY swift test

      - name: Set up signing keychain
        if: env.DRY_RUN != 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_DEVID: ${{ secrets.MACOS_DEVID }}
        run: |
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign \
            || { echo "::error::security import failed — MACOS_CERT_P12 is not a Developer ID .p12 or MACOS_CERT_PASSWORD is wrong"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning build.keychain | grep -qF "$MACOS_DEVID" \
            || { echo "::error::the imported certificate is not the identity named by MACOS_DEVID"; security find-identity -v -p codesigning build.keychain; exit 1; }

      - name: Store notarization credentials
        if: env.DRY_RUN != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials cliphoard-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --validate \
            || { echo "::error::Apple rejected APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD (it must be an app-specific password, not the Apple ID password)"; exit 1; }

      - name: Build, sign, notarize, package DMG
        env:
          DEVID: ${{ secrets.MACOS_DEVID }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          NOTARY_PROFILE: cliphoard-notary
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "unsigned dry run: no signing, no notarization, cask untouched, nothing published"
            unset DEVID NOTARY_PROFILE
          else
            export PROVISION_PROFILE="$RUNNER_TEMP/Cliphoard-DeveloperID.provisionprofile"
            printf '%s' "$MACOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROVISION_PROFILE"
            trap 'rm -f "$PROVISION_PROFILE"' EXIT
          fi
          bash Scripts/release.sh

      - name: Compute DMG checksum
        id: dmg
        run: |
          FILE=$(ls build/Cliphoard-*.dmg)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$FILE" > build/candidate.sha256

      - name: Save candidate for customer-install testing
        uses: actions/upload-artifact@v4
        with:
          name: cliphoard-candidate-${{ github.run_id }}
          path: |
            ${{ steps.dmg.outputs.path }}
            build/candidate.sha256
            Casks/cliphoard.rb
          if-no-files-found: error
